name: Validate scaffold
on:
  push:
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - run: |
          for service in chat-api ai-service; do
            uv sync --locked --directory apps/$service
            uv run --directory apps/$service python -m compileall -q main.py
          done
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
