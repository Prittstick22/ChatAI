name: Validate scaffold
on:
  push:
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - run: |
          for service in chat-api ai-service; do
            uv sync --locked --directory apps/$service
            uv run --directory apps/$service python -m compileall -q main.py
          done
  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      # Each service's locked ruff (dev group). Fix locally with: uv run ruff format .
      - run: |
          failed=0
          for service in chat-api ai-service; do
            echo "::group::$service"
            uv run --locked --directory apps/$service ruff format --diff . || failed=1
            echo "::endgroup::"
          done
          exit $failed
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
