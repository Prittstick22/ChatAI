[project]
name = "chatai-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "openai>=1.50,<3",
    "pydantic>=2,<3",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
